    // ==========================================
    // NOTIFICATION TOAST
    // ==========================================
    function showToast(msg) {
        const toastEl = document.getElementById('toast-notice');
        const toastMsg = document.getElementById('toast-message');
        if (toastEl && toastMsg) {
            toastMsg.textContent = msg;
            toastEl.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
            toastEl.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toastEl.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
                toastEl.classList.remove('translate-y-0', 'opacity-100');
            }, 3000);
        }
    }

    // Direct Navigation
    window.navigateTo = function (targetId, title, activePillId = null) {
        document.querySelectorAll('.module-section').forEach(sec => {
            sec.classList.add('hidden');
            sec.classList.remove('block');
        });

        const targetSection = document.getElementById(targetId);
        if (targetSection) {
            targetSection.classList.remove('hidden');
            targetSection.classList.add('block');
        }

        const headerTitle = document.getElementById('header-title');
        if (headerTitle && title) {
            headerTitle.textContent = title;
        }

        document.querySelectorAll('.quick-nav-pill').forEach(pill => pill.classList.remove('active'));
        if (activePillId) {
            const el = document.getElementById(activePillId);
            if (el) el.classList.add('active');
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // Helper for Real-time listeners
    function addRealTimeListeners(selector, callback) {
      document.querySelectorAll(selector).forEach(el => {
        el.addEventListener('input', callback);
        if(el.tagName === 'SELECT') {
            el.addEventListener('change', callback);
        }
      });
    }

    // ==========================================
    // FAVORITES / QUICK STAR PINS (LocalStorage)
    // ==========================================
    function getPins() {
      try {
        const stored = localStorage.getItem('adjustr_emd_pins');
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        return [];
      }
    }

    function savePins(pins) {
      try {
        localStorage.setItem('adjustr_emd_pins', JSON.stringify(pins));
      } catch (e) {}
    }

    window.togglePin = function (toolId) {
      let pins = getPins();
      const index = pins.indexOf(toolId);
      if (index === -1) {
        pins.push(toolId);
        showToast('Kalkulator ditambahkan ke Favorit Jaga!');
      } else {
        pins.splice(index, 1);
        showToast('Kalkulator dihapus dari Favorit Jaga.');
      }
      savePins(pins);
      updateStarIcons();
      renderPinnedFavorites();
    };

    function updateStarIcons() {
      const pins = getPins();
      CALCULATORS_DB.forEach(tool => {
        const starEl = document.getElementById('star-' + tool.toolId);
        if (starEl) {
          if (pins.includes(tool.toolId)) {
            starEl.className = 'fa-solid fa-star text-xs star-icon text-amber-400';
          } else {
            starEl.className = 'fa-regular fa-star text-xs star-icon text-slate-400';
          }
        }
      });
    }

    function renderPinnedFavorites() {
      const sectionEl = document.getElementById('pinned-favorites-section');
      const gridEl = document.getElementById('pinned-favorites-grid');
      if (!sectionEl || !gridEl) return;

      const pins = getPins();
      if (pins.length === 0) {
        sectionEl.classList.add('hidden');
        gridEl.innerHTML = '';
        return;
      }

      sectionEl.classList.remove('hidden');
      let html = '';
      pins.forEach(toolId => {
        const tool = CALCULATORS_DB.find(t => t.toolId === toolId);
        if (tool) {
          html += `
            <div class="p-3.5 rounded-xl bg-slate-900/70 border border-amber-500/30 hover:border-amber-400/60 shadow-lg transition-all flex items-center justify-between group">
              <div class="flex items-center space-x-3 min-w-0">
                <div class="w-8 h-8 rounded-lg bg-${tool.color}-500/20 text-${tool.color}-400 flex items-center justify-center shrink-0 text-sm">
                  <i class="fa-solid fa-star text-amber-400 text-xs"></i>
                </div>
                <div class="min-w-0">
                  <button type="button" onclick="navigateTo('${tool.id}', '${tool.name.replace(/'/g, "\\'")}', '${tool.pillId}')" class="text-xs font-bold text-white group-hover:text-amber-300 transition text-left truncate block">
                    ${tool.name}
                  </button>
                  <span class="text-[10px] text-slate-400 block truncate">${tool.category}</span>
                </div>
              </div>
              <button type="button" onclick="togglePin('${tool.toolId}')" class="text-amber-400 hover:text-slate-400 p-1.5 transition text-xs shrink-0" title="Hapus dari Pin">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          `;
        }
      });
      gridEl.innerHTML = html;
    }

    // ==========================================
    // UNIVERSAL RESET PER CALCULATOR
    // ==========================================
    window.resetCalculator = function (toolId) {
      const card = document.getElementById('card-' + toolId);
      if (card) {
        // Subtle Flash Animation
        card.classList.remove('flash-reset-anim');
        void card.offsetWidth; // trigger reflow
        card.classList.add('flash-reset-anim');
        setTimeout(() => card.classList.remove('flash-reset-anim'), 500);

        // Reset Inputs inside card
        card.querySelectorAll('input[type="number"], input[type="text"]').forEach(input => {
          if (input.id === 'hypo-target') {
            input.value = "100";
          } else {
            input.value = '';
          }
        });

        card.querySelectorAll('input[type="checkbox"]').forEach(cb => {
          cb.checked = false;
        });

        card.querySelectorAll('select').forEach(sel => {
          sel.selectedIndex = 0;
        });

        // Recalculate specific tool
        switch (toolId) {
          case 'bwps': calcBWPS(); break;
          case 'wayne': calcWayne(); break;
          case 'billewicz': calcBillewicz(); break;
          case 'myxedema': calcMyxedema(); break;
          case 'adrenal': calcAdrenalCrisis(); break;
          case 'apoplexy': calcPAS(); break;
          case 'osmo': calcOsmo(); break;
          case 'ag': calcAG(); break;
          case 'dka-tracker': calcDKATracker(); break;
          case 'hypoglycemia': calcHypoglycemia(); break;
          case 'insulin-tdd': calcInsulin(); break;
          case 'tyg':
          case 'homa':
          case 'friedewald': calcMetabolic(); break;
          case 'aip': calcAIP(); break;
          case 'ascvd': calcASCVD(); break;
          case 'hba1c-eag': calcHbA1cToEAG(); break;
          case 'bridging-insulin': resetInsulinInputs(); break;
        }

        showToast('Parameter kalkulator direset ke default.');
      }
    };

    // ==========================================

    function getNowDateTimeStr() {
      const now = new Date();
      const d = String(now.getDate()).padStart(2, '0');
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const y = now.getFullYear();
      const h = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      return `${d}/${m}/${y} - ${h}:${min}`;
    }

    function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('Resume klinis CPPT berhasil disalin!');
        }).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }

      function fallbackCopy(txt) {
        const textArea = document.createElement("textarea");
        textArea.value = txt;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast('Resume klinis CPPT berhasil disalin!');
        } catch (err) {
          console.error('Gagal menyalin:', err);
        }
        document.body.removeChild(textArea);
      }
    }

    // ==========================================
    // 8. ANION GAP, CORRECTED NA, DELTA GAP & RATIO
    // ==========================================
    function calcAG() {
      const na = parseFloat(document.getElementById('ag-na')?.value);
      const cl = parseFloat(document.getElementById('ag-cl')?.value);
      const hco3 = parseFloat(document.getElementById('ag-hco3')?.value);
      const glu = parseFloat(document.getElementById('ag-glu')?.value);

      const agEl = document.getElementById('res-ag');
      const cnaEl = document.getElementById('res-cna');
      const deltaRatioEl = document.getElementById('res-delta-ratio');
      const deltaGapEl = document.getElementById('res-delta-gap');
      const deltaHco3El = document.getElementById('res-delta-hco3');
      const deltaInterpEl = document.getElementById('res-delta-interp');

      let agVal = NaN;

      if (!isNaN(na) && !isNaN(cl) && !isNaN(hco3) && agEl) {
        agVal = na - (cl + hco3);
        agEl.textContent = agVal.toFixed(1);
      } else if (agEl) {
        agEl.textContent = "-";
      }

      if (!isNaN(na) && !isNaN(glu) && glu > 100 && cnaEl) {
        const cNa = na + 1.6 * ((glu - 100) / 100);
        cnaEl.textContent = cNa.toFixed(1);
      } else if (!isNaN(na) && cnaEl) {
        cnaEl.textContent = na.toFixed(1);
      } else if (cnaEl) {
        cnaEl.textContent = "-";
      }

      // Delta Ratio calculation
      if (!isNaN(agVal) && !isNaN(hco3) && deltaRatioEl && deltaGapEl && deltaHco3El && deltaInterpEl) {
        const deltaAG = agVal - 12;
        const deltaHCO3 = 24 - hco3;
        deltaGapEl.textContent = (deltaAG > 0 ? '+' : '') + deltaAG.toFixed(1);
        deltaHco3El.textContent = deltaHCO3.toFixed(1);

        if (deltaHCO3 > 0) {
          const ratio = deltaAG / deltaHCO3;
          deltaRatioEl.textContent = ratio.toFixed(2);

          if (ratio < 0.8) {
            deltaInterpEl.innerHTML = '<span class="text-amber-400 font-bold">Delta Ratio &lt; 0.8:</span> Mixed High Anion Gap Acidosis + <strong>NAGMA (Hyperchloremic Acidosis)</strong>. Sering terjadi pasca resusitasi kristaloid NaCl 0.9% masif.';
          } else if (ratio <= 2.0) {
            deltaInterpEl.innerHTML = '<span class="text-emerald-400 font-bold">Delta Ratio 0.8 - 2.0:</span> <strong>Pure High Anion Gap Acidosis (HAGMA murni)</strong>. Tipikal untuk DKA tanpa gangguan asam-basa sekunder.';
          } else {
            deltaInterpEl.innerHTML = '<span class="text-purple-400 font-bold">Delta Ratio &gt; 2.0:</span> Mixed High Anion Gap Acidosis + <strong>Alkalosis Metabolik</strong> (akibat muntah hebat) atau retensi bikarbonat kompensasi.';
          }
        } else {
          deltaRatioEl.textContent = "-";
          deltaInterpEl.textContent = "Kadar bikarbonat normal/tinggi (HCO3 >= 24 mEq/L).";
        }
      } else if (deltaRatioEl) {
        deltaRatioEl.textContent = "-";
        if (deltaGapEl) deltaGapEl.textContent = "-";
        if (deltaHco3El) deltaHco3El.textContent = "-";
      }
    }
    addRealTimeListeners('#ag-na, #ag-cl, #ag-hco3, #ag-glu', calcAG);

    // ==========================================
    // 9. DKA SEVERITY & RESOLUTION TRACKER
    // ==========================================
    function calcDKATracker() {
      const ph = parseFloat(document.getElementById('dka-ph')?.value);
      const hco3 = parseFloat(document.getElementById('dka-hco3')?.value);
      const glu = parseFloat(document.getElementById('dka-glu')?.value);
      const ag = parseFloat(document.getElementById('dka-ag')?.value);
      const k = parseFloat(document.getElementById('dka-k')?.value);
      const mental = document.getElementById('dka-mental')?.value || 'alert';

      const sevEl = document.getElementById('res-dka-severity');
      const resStatusEl = document.getElementById('res-dka-res-status');
      const resBadgeEl = document.getElementById('dka-resolution-badge');
      const guardrailK = document.getElementById('guardrail-dka');

      // Kalium Guardrail
      if (!isNaN(k) && k < 3.5 && guardrailK) {
        guardrailK.classList.remove('hidden');
      } else if (guardrailK) {
        guardrailK.classList.add('hidden');
      }

      // Severity Stratification
      if (sevEl) {
        if (!isNaN(ph) || !isNaN(hco3)) {
          if (ph < 7.00 || hco3 < 10 || mental === 'stupor') {
            sevEl.textContent = "DKA Berat (Severe)";
            sevEl.className = "text-2xl sm:text-3xl font-extrabold text-rose-500 tracking-tight leading-none";
          } else if (ph < 7.25 || hco3 < 15 || mental === 'drowsy') {
            sevEl.textContent = "DKA Sedang (Moderate)";
            sevEl.className = "text-2xl sm:text-3xl font-extrabold text-amber-400 tracking-tight leading-none";
          } else if (ph <= 7.30 || hco3 <= 18) {
            sevEl.textContent = "DKA Ringan (Mild)";
            sevEl.className = "text-2xl sm:text-3xl font-extrabold text-emerald-400 tracking-tight leading-none";
          } else {
            sevEl.textContent = "Non-Acidotic";
            sevEl.className = "text-2xl sm:text-3xl font-extrabold text-cyan-400 tracking-tight leading-none";
          }
        } else {
          sevEl.textContent = "-";
        }
      }

      // Resolution Checklist
      let resolvedCount = 0;
      const critGluPass = !isNaN(glu) && glu < 200;
      const critHco3Pass = !isNaN(hco3) && hco3 >= 18;
      const critPhPass = !isNaN(ph) && ph > 7.30;
      const critAgPass = !isNaN(ag) && ag <= 12;

      function updateCritBox(boxId, icoId, passed) {
        const box = document.getElementById(boxId);
        const ico = document.getElementById(icoId);
        if (!box || !ico) return;
        if (passed) {
          box.className = "p-2.5 rounded-lg bg-emerald-950/40 border border-emerald-500/40 text-emerald-300 font-semibold";
          ico.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i>';
        } else {
          box.className = "p-2.5 rounded-lg bg-slate-950/60 border border-slate-800 text-slate-400";
          ico.innerHTML = '<i class="fa-solid fa-clock"></i>';
        }
      }

      updateCritBox('crit-glu', 'ico-crit-glu', critGluPass);
      updateCritBox('crit-hco3', 'ico-crit-hco3', critHco3Pass);
      updateCritBox('crit-ph', 'ico-crit-ph', critPhPass);
      updateCritBox('crit-ag', 'ico-crit-ag', critAgPass);

      if (critHco3Pass) resolvedCount++;
      if (critPhPass) resolvedCount++;
      if (critAgPass) resolvedCount++;

      const isResolved = critGluPass && (resolvedCount >= 2);

      if (resStatusEl && resBadgeEl) {
        if (isResolved) {
          resStatusEl.textContent = "Resolusi Tercapai (Siap SC)";
          resStatusEl.className = "text-[11px] sm:text-xs text-emerald-400 uppercase tracking-wider font-semibold mt-1 sm:mt-1.5 text-right";
          resBadgeEl.textContent = "Resolusi Terpenuhi (Siap Bridging)";
          resBadgeEl.className = "px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        } else {
          resStatusEl.textContent = "Belum Resolusi (Lanjut IV)";
          resStatusEl.className = "text-[11px] sm:text-xs text-slate-400 uppercase tracking-wider font-semibold mt-1 sm:mt-1.5 text-right";
          resBadgeEl.textContent = "Belum Terpenuhi (Lanjut Drip IV)";
          resBadgeEl.className = "px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-800 text-slate-400 border border-slate-700";
        }
      }
    }
    addRealTimeListeners('.dka-input', calcDKATracker);

    // ==========================================
    // 10. KOREKSI HIPOGLIKEMIA BERAT (PERKENI & Rumus 30)
    // ==========================================
    function calcHypoglycemia() {
      const gds = parseFloat(document.getElementById('hypo-gds')?.value);
      const target = parseFloat(document.getElementById('hypo-target')?.value) || 100;
      const conscious = document.getElementById('hypo-conscious')?.value || 'unconscious';

      const resFlakonEl = document.getElementById('res-hypo-flakon');
      const resInterpEl = document.getElementById('res-hypo-interp');
      const perkeniDescEl = document.getElementById('hypo-perkeni-desc');
      const rumus30DescEl = document.getElementById('hypo-rumus30-desc');
      const guardrailHypo = document.getElementById('guardrail-hypo');

      // Guardrail if unconscious
      if (conscious === 'unconscious' && guardrailHypo) {
        guardrailHypo.classList.remove('hidden');
      } else if (guardrailHypo) {
        guardrailHypo.classList.add('hidden');
      }

      if (!isNaN(gds)) {
        let perkeniFlakon = 0;
        let perkeniText = '';

        if (gds < 50) {
          perkeniFlakon = 2;
          perkeniText = "Bolus D40% 50 cc (2 flakon) IV stat";
        } else if (gds < 70) {
          perkeniFlakon = 1;
          perkeniText = "Bolus D40% 25 cc (1 flakon) IV stat";
        } else {
          perkeniFlakon = 0;
          perkeniText = "Tidak perlu bolus D40% (GDS >= 70 mg/dL)";
        }

        const delta = Math.max(0, target - gds);
        const r30Flakon = (delta / 30);
        const gramDextrose = r30Flakon * 10;

        if (resFlakonEl) {
          resFlakonEl.textContent = perkeniFlakon > 0 ? perkeniFlakon : (r30Flakon > 0 ? r30Flakon.toFixed(1) : '0');
        }
        if (resInterpEl) {
          resInterpEl.textContent = perkeniFlakon > 0 ? `${perkeniFlakon * 25} cc D40% IV` : "GDS Tercapai";
        }
        if (perkeniDescEl) perkeniDescEl.textContent = perkeniText;
        if (rumus30DescEl) {
          rumus30DescEl.textContent = `${r30Flakon.toFixed(1)} Flakon (~ ${gramDextrose.toFixed(0)} gram Dekstrosa murni)`;
        }
      } else {
        if (resFlakonEl) resFlakonEl.textContent = "-";
        if (resInterpEl) resInterpEl.textContent = "Flakon D40%";
        if (perkeniDescEl) perkeniDescEl.textContent = "-";
        if (rumus30DescEl) rumus30DescEl.textContent = "-";
      }
    }
    addRealTimeListeners('.hypo-input', calcHypoglycemia);

    // ==========================================
    // 11. INSULIN BASAL-BOLUS TDD
    // ==========================================
    function calcInsulin() {
      const wt = parseFloat(document.getElementById('ins-wt')?.value);
      const factor = parseFloat(document.getElementById('ins-factor')?.value);

      const tddEl = document.getElementById('res-tdd');
      const basalEl = document.getElementById('res-basal');
      const bolusEl = document.getElementById('res-bolus');

      if (!isNaN(wt) && !isNaN(factor) && tddEl && basalEl && bolusEl) {
        const tdd = wt * factor;
        const basal = tdd * 0.5;
        const bolus = (tdd * 0.5) / 3;

        tddEl.textContent = Math.round(tdd);
        basalEl.innerHTML = `${Math.round(basal)} <span class="text-sm font-medium text-slate-400 ml-1">U Qd</span>`;
        bolusEl.innerHTML = `${Math.round(bolus)} <span class="text-sm font-medium text-slate-400 ml-1">U TID</span>`;
      } else if (tddEl && basalEl && bolusEl) {
        tddEl.textContent = "-";
        basalEl.innerHTML = `- <span class="text-sm font-medium text-slate-400 ml-1">U Qd</span>`;
        bolusEl.innerHTML = `- <span class="text-sm font-medium text-slate-400 ml-1">U TID</span>`;
      }
    }
    addRealTimeListeners('#ins-wt, #ins-factor', calcInsulin);

    // ==========================================
    // 12, 13, 14. METABOLIC: TYG, HOMA-IR, FRIEDEWALD
    // ==========================================
    function calcMetabolic() {
      // TyG
      const tgTyg = parseFloat(document.getElementById('tyg-tg')?.value);
      const gluTyg = parseFloat(document.getElementById('tyg-glu')?.value);
      const tygEl = document.getElementById('res-tyg');
      if (tygEl) {
        if (!isNaN(tgTyg) && !isNaN(gluTyg)) {
          const tyg = Math.log(tgTyg * gluTyg) / 2;
          tygEl.textContent = tyg.toFixed(2);
        } else {
          tygEl.textContent = "-";
        }
      }

      // HOMA-IR
      const insHoma = parseFloat(document.getElementById('homa-ins')?.value);
      const gluHoma = parseFloat(document.getElementById('homa-glu')?.value);
      const homaEl = document.getElementById('res-homa');
      if (homaEl) {
        if (!isNaN(insHoma) && !isNaN(gluHoma)) {
          const homa = (insHoma * gluHoma) / 405;
          homaEl.textContent = homa.toFixed(2);
        } else {
          homaEl.textContent = "-";
        }
      }

      // Friedewald
      const tc = parseFloat(document.getElementById('lip-tc')?.value);
      const hdl = parseFloat(document.getElementById('lip-hdl')?.value);
      const tgLip = parseFloat(document.getElementById('lip-tg')?.value);
      
      const resLdl = document.getElementById('res-ldl');
      const ldlWarn = document.getElementById('ldl-warning');

      if (!isNaN(tc) && !isNaN(hdl) && !isNaN(tgLip) && resLdl) {
        if (tgLip > 400) {
          resLdl.textContent = "N/A";
          resLdl.className = "text-2xl sm:text-3xl font-extrabold text-slate-600 tracking-tight leading-none";
          if (ldlWarn) ldlWarn.classList.remove('hidden');
        } else {
          const ldl = tc - hdl - (tgLip / 5);
          if (ldl < 0) {
            resLdl.textContent = "< 0";
            resLdl.className = "text-2xl sm:text-3xl font-extrabold text-amber-400 tracking-tight leading-none";
            if (ldlWarn) {
              ldlWarn.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-base mr-2.5"></i> Hasil LDL negatif (< 0 mg/dL). Rumus Friedewald tidak valid untuk sampel ini.';
              ldlWarn.classList.remove('hidden');
            }
          } else {
            resLdl.textContent = ldl.toFixed(1);
            resLdl.className = "text-2xl sm:text-3xl font-extrabold text-sky-400 tracking-tight leading-none";
            if (ldlWarn) ldlWarn.classList.add('hidden');
          }
        }
      } else if (resLdl) {
        resLdl.textContent = "-";
        resLdl.className = "text-2xl sm:text-3xl font-extrabold text-sky-400 tracking-tight leading-none";
        if (ldlWarn) ldlWarn.classList.add('hidden');
      }
    }
    addRealTimeListeners('#tyg-tg, #tyg-glu, #homa-ins, #homa-glu, #lip-tc, #lip-hdl, #lip-tg', calcMetabolic);

    // ==========================================
    // 15. ATHEROGENIC INDEX OF PLASMA (AIP)
    // ==========================================
    function calcAIP() {
      const tg = parseFloat(document.getElementById('aip-tg')?.value);
      const hdl = parseFloat(document.getElementById('aip-hdl')?.value);
      const resEl = document.getElementById('res-aip');
      const interpEl = document.getElementById('res-aip-interp');
      if (!resEl || !interpEl) return;

      if (!isNaN(tg) && !isNaN(hdl) && tg > 0 && hdl > 0) {
        const tg_mmol = tg / 88.57;
        const hdl_mmol = hdl / 38.67;
        const aip = Math.log10(tg_mmol / hdl_mmol);
        resEl.textContent = aip.toFixed(3);

        if (aip > 0.21) {
          interpEl.textContent = "Risiko Tinggi (High sdLDL)";
          interpEl.className = "text-[10px] text-rose-400 mt-0.5 uppercase font-semibold";
          resEl.className = "text-2xl sm:text-3xl font-extrabold text-rose-400 tracking-tight leading-none";
        } else if (aip >= 0.11) {
          interpEl.textContent = "Risiko Sedang";
          interpEl.className = "text-[10px] text-amber-400 mt-0.5 uppercase font-semibold";
          resEl.className = "text-2xl sm:text-3xl font-extrabold text-amber-400 tracking-tight leading-none";
        } else {
          interpEl.textContent = "Risiko Rendah";
          interpEl.className = "text-[10px] text-emerald-400 mt-0.5 uppercase font-semibold";
          resEl.className = "text-2xl sm:text-3xl font-extrabold text-teal-400 tracking-tight leading-none";
        }
      } else {
        resEl.textContent = "-";
        interpEl.textContent = "Risiko Rendah";
        resEl.className = "text-2xl sm:text-3xl font-extrabold text-teal-400 tracking-tight leading-none";
      }
    }
    addRealTimeListeners('#aip-tg, #aip-hdl', calcAIP);

    // ==========================================
    // 16. ASCVD 10-YEAR RISK ESTIMATOR
    // ==========================================
    function calcASCVD() {
      const age = parseFloat(document.getElementById('ascvd-age')?.value);
      const gender = document.getElementById('ascvd-gender')?.value || 'male';
      const sbp = parseFloat(document.getElementById('ascvd-sbp')?.value);
      const htn = document.getElementById('ascvd-htn')?.value === 'yes';
      const tc = parseFloat(document.getElementById('ascvd-tc')?.value);
      const hdl = parseFloat(document.getElementById('ascvd-hdl')?.value);
      const dm = document.getElementById('ascvd-dm')?.value === 'yes';
      const smoke = document.getElementById('ascvd-smoke')?.value === 'yes';

      const resScoreEl = document.getElementById('res-ascvd-score');
      const resTargetEl = document.getElementById('res-ascvd-target');
      if (!resScoreEl || !resTargetEl) return;

      if (!isNaN(age) && !isNaN(sbp) && !isNaN(tc) && !isNaN(hdl)) {
        // Pooled Cohort Equations simplified estimation
        let estRisk = 0;
        if (gender === 'male') {
          estRisk = (age * 0.4) + (tc * 0.05) - (hdl * 0.08) + (sbp * (htn ? 0.08 : 0.04)) + (dm ? 8.0 : 0) + (smoke ? 7.5 : 0) - 22;
        } else {
          estRisk = (age * 0.35) + (tc * 0.04) - (hdl * 0.07) + (sbp * (htn ? 0.07 : 0.035)) + (dm ? 7.0 : 0) + (smoke ? 6.5 : 0) - 20;
        }
        estRisk = Math.max(1.0, Math.min(65.0, estRisk));

        resScoreEl.textContent = estRisk.toFixed(1) + " %";

        if (estRisk >= 20.0 || dm) {
          resScoreEl.className = "text-3xl sm:text-4xl font-extrabold text-rose-400 tracking-tight leading-none";
          resTargetEl.innerHTML = 'Target LDL: <strong class="text-rose-300">&lt; 55 - 70 mg/dL</strong>';
        } else if (estRisk >= 7.5) {
          resScoreEl.className = "text-3xl sm:text-4xl font-extrabold text-amber-400 tracking-tight leading-none";
          resTargetEl.innerHTML = 'Target LDL: <strong class="text-amber-300">&lt; 70 - 100 mg/dL</strong>';
        } else {
          resScoreEl.className = "text-3xl sm:text-4xl font-extrabold text-blue-400 tracking-tight leading-none";
          resTargetEl.innerHTML = 'Target LDL: <strong class="text-blue-300">&lt; 100 - 115 mg/dL</strong>';
        }
      } else {
        resScoreEl.textContent = "- %";
        resTargetEl.textContent = "Target LDL: -";
      }
    }
    addRealTimeListeners('.ascvd-input', calcASCVD);

    // ==========================================
    // 17. KONVERSI HBA1C KE EAG
    // ==========================================
    function calcHbA1cToEAG() {
      const hba1c = parseFloat(document.getElementById('eag-hba1c')?.value);
      const resMg = document.getElementById('res-eag-mg');
      const resMmol = document.getElementById('res-eag-mmol');
      if (!resMg || !resMmol) return;

      if (!isNaN(hba1c) && hba1c > 3.0) {
        const eagMg = 28.7 * hba1c - 46.7;
        const eagMmol = 1.59 * hba1c - 2.59;
        resMg.textContent = Math.round(eagMg) + " mg/dL";
        resMmol.textContent = eagMmol.toFixed(1) + " mmol/L";
      } else {
        resMg.textContent = "-";
        resMmol.textContent = "- mmol/L";
      }
    }
    addRealTimeListeners('#eag-hba1c', calcHbA1cToEAG);

    // ==========================================
    // 18. BRIDGING INSULIN TRANSITION
    // ==========================================
    function fmtIndo(num, digits = 1) {
      if (isNaN(num) || !isFinite(num)) return "0";
      return Number(num).toFixed(digits).replace('.', ',');
    }

    function renderInsulinTable() {
      const startHourSelect = document.getElementById('ins-start-hour');
      if (!startHourSelect) return;
      const startHour = parseInt(startHourSelect.value, 10) || 0;
      const tbody = document.getElementById('insulin-table-body');
      if (!tbody) return;
      
      const currentVals = [];
      tbody.querySelectorAll('.ins-hourly-input').forEach(input => {
        currentVals.push(input.value);
      });

      let html = '';
      for (let i = 0; i < 24; i++) {
        let h = (startHour + i) % 24;
        let hourStr = `${h.toString().padStart(2, '0')}:00`;
        let val = currentVals[i] !== undefined ? currentVals[i] : '0';
        
        html += `
          <tr class="hover:bg-slate-900/60 transition-colors">
            <td class="px-4 py-2 font-mono text-slate-300 text-center bg-slate-950/40 border-r border-slate-800">${hourStr}</td>
            <td class="px-3 py-1.5">
              <input type="number" class="ins-hourly-input input-modern !py-1 text-center font-mono" value="${val}" min="0" step="0.5">
            </td>
          </tr>
        `;
      }
      tbody.innerHTML = html;

      tbody.querySelectorAll('.ins-hourly-input').forEach(inp => {
        inp.addEventListener('input', calcBridgingInsulin);
      });

      calcBridgingInsulin();
    }

    function resetInsulinInputs() {
      document.querySelectorAll('.ins-hourly-input').forEach(input => {
        input.value = "0";
      });
      calcBridgingInsulin();
    }

    function quickFillInsulin(val) {
      document.querySelectorAll('.ins-hourly-input').forEach(input => {
        input.value = val;
      });
      calcBridgingInsulin();
    }

    function calcBridgingInsulin() {
      let total = 0;
      document.querySelectorAll('.ins-hourly-input').forEach(input => {
        total += parseFloat(input.value) || 0;
      });

      const totalBB = total * 0.8;
      const basal = totalBB * 0.5;
      const prandial = basal / 3;

      const totalEl = document.getElementById('ins-total');
      if (!totalEl) return;

      totalEl.innerText = fmtIndo(total, 1);
      document.getElementById('ins-bb-80').innerText = fmtIndo(totalBB, 1);
      document.getElementById('ins-basal-50').innerText = fmtIndo(basal, 1);
      document.getElementById('ins-prandial-3').innerText = fmtIndo(prandial, 1);

      let cppt = `BRIDGING INSULIN (TRANSISI KE SUBKUTAN)\n\n`;
      cppt += `Total drip 24 jam       : ${fmtIndo(total, 1)} U\n`;
      cppt += `Total basal-bolus (80%) : ${fmtIndo(totalBB, 1)} U\n`;
      cppt += `Insulin basal (50%)     : ${fmtIndo(basal, 1)} U (diberikan 1x/hari SC)\n`;
      cppt += `Insulin prandial (/x3)  : ${fmtIndo(prandial, 1)} U (tiap makan SC)\n\n`;
      cppt += `Instruksi Overlap:\n`;
      cppt += `- Berikan dosis insulin basal subkutan 1 - 2 jam sebelum drip IV dihentikan.\n`;
      cppt += `- Pastikan pasien toleransi intake oral saat beralih ke regimen subkutan.`;

      const cpptEl = document.getElementById('ins-cppt');
      if (cpptEl) cpptEl.innerText = cppt;
    }

    // ==========================================
    // GLOBAL SEARCH ENGINE
    // ==========================================
    function initGlobalSearch() {
        const searchInput = document.getElementById('global-search-input');
        const searchDropdown = document.getElementById('search-results-dropdown');
        const clearBtn = document.getElementById('search-clear-btn');

        if (!searchInput || !searchDropdown) return;

        function renderResults(query) {
            const clean = query.trim().toLowerCase();
            if (!clean) {
                searchDropdown.classList.add('hidden');
                searchDropdown.innerHTML = '';
                if (clearBtn) clearBtn.classList.add('hidden');
                return;
            }

            if (clearBtn) clearBtn.classList.remove('hidden');

            const matches = CALCULATORS_DB.filter(tool => {
                return tool.name.toLowerCase().includes(clean) ||
                       tool.category.toLowerCase().includes(clean) ||
                       tool.desc.toLowerCase().includes(clean) ||
                       tool.keywords.some(k => k.toLowerCase().includes(clean));
            });

            if (matches.length === 0) {
                searchDropdown.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center">Tidak ditemukan kalkulator untuk "' + query + '".</div>';
                searchDropdown.classList.remove('hidden');
                return;
            }

            let html = '<div class="space-y-1">';
            matches.forEach(tool => {
                html += `
                    <button type="button" onclick="selectSearchResult('${tool.id}', '${tool.name.replace(/'/g, "\\'")}', '${tool.pillId}', '${tool.cardId}')" class="w-full p-2.5 rounded-lg bg-slate-800/60 hover:bg-emerald-500/20 border border-slate-700/50 hover:border-emerald-500/50 text-left transition-all group flex items-start space-x-3">
                        <div class="h-7 w-7 rounded-md bg-${tool.color}-500/20 text-${tool.color}-400 flex items-center justify-center shrink-0 text-xs mt-0.5">
                            <i class="fa-solid fa-calculator"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center space-x-2">
                                <span class="text-xs font-bold text-white group-hover:text-emerald-400 transition-colors truncate">${tool.name}</span>
                                <span class="text-[10px] px-1.5 py-0.2 rounded bg-slate-700 text-slate-300 font-medium shrink-0">${tool.category}</span>
                            </div>
                            <p class="text-[11px] text-slate-400 line-clamp-1 mt-0.5">${tool.desc}</p>
                        </div>
                        <i class="fa-solid fa-arrow-right text-xs text-slate-500 group-hover:text-emerald-400 mt-1 shrink-0"></i>
                    </button>
                `;
            });
            html += '</div>';

            searchDropdown.innerHTML = html;
            searchDropdown.classList.remove('hidden');
        }

        searchInput.addEventListener('input', (e) => {
            renderResults(e.target.value);
        });

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
            if (e.key === 'Escape') {
                if (!searchDropdown.classList.contains('hidden')) {
                  searchDropdown.classList.add('hidden');
                }
                closeUnitConverterModal();
            }
        });

        document.addEventListener('click', (e) => {
            const container = document.getElementById('header-search-container');
            if (container && !container.contains(e.target)) {
                searchDropdown.classList.add('hidden');
            }
        });
    }

    window.clearGlobalSearch = function () {
        const input = document.getElementById('global-search-input');
        if (input) {
            input.value = '';
            input.focus();
            const dropdown = document.getElementById('search-results-dropdown');
            if (dropdown) {
                dropdown.classList.add('hidden');
                dropdown.innerHTML = '';
            }
            const clearBtn = document.getElementById('search-clear-btn');
            if (clearBtn) clearBtn.classList.add('hidden');
        }
    };

    window.selectSearchResult = function (targetId, name, pillId, cardId) {
        const searchDropdown = document.getElementById('search-results-dropdown');
        if (searchDropdown) searchDropdown.classList.add('hidden');
        navigateTo(targetId, name, pillId);
        if (cardId) {
          setTimeout(() => {
            const cardEl = document.getElementById(cardId);
            if (cardEl) {
              cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
              cardEl.classList.remove('flash-reset-anim');
              void cardEl.offsetWidth;
              cardEl.classList.add('flash-reset-anim');
            }
          }, 200);
        }
    };

    // ==========================================
    // INIT ALL ON DOM LOAD
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      initGlobalSearch();
      renderPinnedFavorites();
      updateStarIcons();
      calcBWPS();
      calcWayne();
      calcBillewicz();
      calcMyxedema();
      calcAdrenalCrisis();
      calcPAS();
      calcOsmo();
      calcAG();
      calcDKATracker();
      calcHypoglycemia();
      calcInsulin();
      calcMetabolic();
      calcAIP();
      calcASCVD();
      calcHbA1cToEAG();
      renderInsulinTable();
    });
    </script>
</body>
</html>
